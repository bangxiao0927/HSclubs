# This is a basic workflow to build robot code.
name: CI
# Controls when the action will run. Triggers the workflow on push or pull request
# events but only for the main branch.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    # This grabs the WPILib docker container
    container:
      image: wpilib/roborio-cross-ubuntu:2025-22.04
      options: --dns=1.1.1.1 --dns=8.8.8.8

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:

    # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
    - uses: actions/checkout@v4

    # Test backend
    - name: backend
      run: |
        cd backend
        chmod +x mvnw        # mvnw shell file run permission setup
        git config --global --add safe.directory $GITHUB_WORKSPACE  # git safe directory setup
        ./mvnw test
        
    # Use actions/setup-node instead of manually apt-installing Node inside the
    # container: apt-get pulled in a fresh ca-certificates package that broke the
    # image's CA bundle, which made the NodeSource `curl | bash` install fail
    # silently (curl -fsSL swallows the TLS error, and the pipeline's exit code
    # came from `bash` seeing empty stdin and exiting 0), leaving the distro's
    # ancient nodejs 12 (no npm) installed instead.
    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    # Cross-repo guard: the vendored contracts/v1 must match the canonical copy the guiding page
    # publishes, so a template or aggregate field drift fails here rather than at runtime in the app.
    - name: contract sync
      run: node scripts/check-contract-sync.mjs

    # The club CSV feeds three generated SQL files, and one of them had already drifted from its
    # generator before this guard existed. The generator is Python, so it needs an interpreter.
    # Pin the version: setup-python's newest builds need a newer glibc than this 22.04 container
    # has, and '3.x' resolves to one of those.
    - name: Install Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: club sql sync
      run: node scripts/check-club-sql-sync.mjs

    # Test frountend
    - name: frontend
      working-directory: frontend
      run: |
        npm ci
        npm run test:unit -- --run
        npm run build
