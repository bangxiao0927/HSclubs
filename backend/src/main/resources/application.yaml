server:
  port: 8080

app:
  security:
    allowed-origins:
      - http://localhost:5173
    post-login-redirect-uri: http://localhost:5173/auth/callback
    owner-emails: ${APP_OWNER_EMAILS}

spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:mysql://localhost:3306/mydb?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: xiaobangnb666
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: never
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/api/auth/google/callback"
            scope:
              - email
              - profile
              - openid

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.demo
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
