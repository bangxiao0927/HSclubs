server:
  address: 127.0.0.1
  port: 8080
  # nginx terminates TLS and proxies to plain HTTP (see docs/DEPLOYMENT.md), so without this
  # the app sees every request as insecure: request.isSecure() stays false, Tomcat then omits
  # the Secure attribute from JSESSIONID, and any absolute URL the app builds (notably the
  # OAuth2 redirect) comes out as http://. "framework" makes Spring honour X-Forwarded-Proto,
  # which the proxy already sends.
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:framework}
  # At the 2MB default, Tomcat aborts the connection on an oversize upload rather than
  # delivering the error body, so the client sees a network error instead of the readable 400
  # ImageStorageService produces. This must exceed multipart.max-request-size below.
  tomcat:
    max-swallow-size: 10MB
  servlet:
    session:
      timeout: 7d
      cookie:
        max-age: 7d  # Persist JSESSIONID across browser restarts
        # MUST stay "lax", never "strict". The Google OAuth2 callback
        # (/api/auth/*/callback) is a cross-site top-level navigation coming back from
        # accounts.google.com; a "strict" cookie is withheld on that first request, so
        # Spring Security can't find the in-flight authorization request and login fails
        # with "authorization_request_not_found". "lax" still blocks the cookie on
        # cross-site subrequests (images, fetch, iframes), which is what CSRF actually
        # exploits, so this is not a meaningful weakening.
        same-site: ${SESSION_COOKIE_SAME_SITE:lax}
        # Defaults to false so plain-HTTP local development still gets a session at all (a
        # Secure cookie is dropped by the browser over http://localhost). Production must set
        # SESSION_COOKIE_SECURE=true: this is a 7-day session cookie, and without it the
        # cookie is eligible to travel over a plain-HTTP request.
        secure: ${SESSION_COOKIE_SECURE:false}

app:
  club-location-repair:
    enabled: ${APP_CLUB_LOCATION_REPAIR_ENABLED:true}
  security:
    frontend-origin: ${FRONTEND_ORIGIN}
    allowed-origins:
      - ${app.security.frontend-origin}
    post-login-redirect-uri: "${app.security.frontend-origin}/auth/callback"
    owner-emails: ${APP_OWNER_EMAILS}
    authorization-request-base-uri: ${APP_AUTHORIZATION_REQUEST_BASE_URI:/api/auth/authorize}
    csrf:
      # Server-side CSRF token enforcement, independent of and in addition to the
      # SameSite cookie above. Defaults to false: the frontend does not yet read the
      # XSRF-TOKEN cookie and send it back as X-XSRF-TOKEN on writes, so turning this on
      # before that frontend change ships would 403 every write request. Flip to true
      # once the frontend is updated.
      enabled: ${APP_CSRF_ENABLED:false}
    login:
      # Who may sign in at all. Both restrictions are off by default: other schools copy this
      # repo, so a fresh deployment has to work with any Google account, and a school that
      # wants its site limited to its own Workspace turns them on here without touching code.
      # Comma-separated, e.g. APP_ALLOWED_EMAIL_DOMAINS=students.example.edu,example.edu
      allowed-email-domains: ${APP_ALLOWED_EMAIL_DOMAINS:}
      require-verified-email: ${APP_REQUIRE_VERIFIED_EMAIL:false}
  upload:
    dir: ${APP_UPLOAD_DIR:uploads}
  avatar:
    instagram:
      enabled: ${APP_INSTAGRAM_AVATAR_CACHE_ENABLED:true}
      python-command: ${APP_INSTAGRAM_AVATAR_PYTHON_COMMAND:python3}
      session-user: ${APP_INSTAGRAM_AVATAR_SESSION_USER:}
      session-file: ${APP_INSTAGRAM_AVATAR_SESSION_FILE:}
      cookie-browser: ${APP_INSTAGRAM_AVATAR_COOKIE_BROWSER:}
      cookie-file: ${APP_INSTAGRAM_AVATAR_COOKIE_FILE:}
      profile-api-url-template: ${APP_INSTAGRAM_AVATAR_PROFILE_API_URL_TEMPLATE:https://www.instagram.com/api/v1/users/web_profile_info/?username=%s}
      fetch-timeout-ms: ${APP_INSTAGRAM_AVATAR_FETCH_TIMEOUT_MS:10000}
      # Refresh a cached club avatar after 60 days (approximately two months).
      cache-ttl-ms: ${APP_INSTAGRAM_AVATAR_CACHE_TTL_MS:5184000000}
      # The official MVHS list currently has fewer than 120 Instagram profiles,
      # so a fresh deployment can populate every local icon in its first pass.
      max-refresh-per-run: ${APP_INSTAGRAM_AVATAR_MAX_REFRESH_PER_RUN:120}
      refresh-initial-delay-ms: ${APP_INSTAGRAM_AVATAR_REFRESH_INITIAL_DELAY_MS:30000}
      refresh-fixed-delay-ms: ${APP_INSTAGRAM_AVATAR_REFRESH_FIXED_DELAY_MS:43200000}
      # How long a failed fetch for a given handle is remembered before it is retried again,
      # so a persistently-broken handle can't be hammered on every request for it.
      negative-cache-ttl-ms: ${APP_INSTAGRAM_AVATAR_NEGATIVE_CACHE_TTL_MS:900000}
      # Caps how many distinct handles the public on-demand endpoint (GET
      # /api/avatars/instagram/{handle}) will fetch concurrently; anything beyond this gets
      # the placeholder immediately instead of spawning another Instaloader process.
      max-concurrent-on-demand-refreshes: ${APP_INSTAGRAM_AVATAR_MAX_CONCURRENT_ON_DEMAND_REFRESHES:4}
      # How long the set of club-linked Instagram handles is cached in memory before the
      # public on-demand endpoint (GET /api/avatars/instagram/{handle}) re-queries it. That
      # lookup runs on EVERY request that misses the on-disk avatar cache -- including every
      # request for a random/unknown handle, which by definition always misses -- so without
      # this cache it was an unbounded, unauthenticated full-table club query. The handle set
      # only changes when an admin adds a club or edits its Instagram URL, so 5 minutes trades
      # a short staleness window (a newly-linked handle becomes fetchable within this long,
      # without waiting for the 12-hour prewarm or a restart) for collapsing any burst of
      # requests down to at most one query per window.
      known-handles-cache-ttl-ms: ${APP_INSTAGRAM_AVATAR_KNOWN_HANDLES_CACHE_TTL_MS:300000}
  summary:
    school-name: ${APP_SUMMARY_SCHOOL_NAME:HS Clubs}
    short-name: ${APP_SUMMARY_SHORT_NAME:HS Clubs}
    slug: ${APP_SUMMARY_SLUG:hsclubs}
    # One human-readable line for the guiding page's listing, e.g. a street address. School
    # identity, like the name above -- never derived from club data. Empty publishes the field
    # as null rather than as an empty string, so a consumer has one thing to check, not two.
    address: ${APP_SUMMARY_ADDRESS:}
    # The zone the database writes its timestamps in, used to turn the stored wall-clock
    # updated_at into the offset-bearing lastUpdatedAt the summary publishes. Empty means "take
    # it from the datasource URL's serverTimezone", falling back to this JVM's zone when the URL
    # declares none -- the driver hands back that column in the database session's zone, so the
    # URL is the better default. Set this only when neither is the truth.
    time-zone: ${APP_SUMMARY_TIME_ZONE:}
    # /api/summary is unauthenticated, so a burst of requests is the cheapest way to make the
    # site work. The assembled response is cached for this long; short enough that the future
    # aggregator still sees a change promptly, long enough that a flood collapses onto one query.
    cache-ttl-ms: ${APP_SUMMARY_CACHE_TTL_MS:60000}
  school:
    # The permanent identity the guiding page registry issued for this school (`npm run id:issue`
    # over there). Empty is the default and a supported state: this deployment then serves
    # /api/summary exactly as before and publishes no v1 surface at all -- /api/v1/summary and
    # /.well-known/hsclubs-app.json answer 404. A value that is present but malformed fails
    # startup, because publishing a wrong identity reads as this origin claiming to be another
    # school. It never changes: a rename, a new slug or an approved new host all keep it.
    id: ${APP_SCHOOL_ID:}
    # The public origin visitors use, scheme and host only. Published in the manifest and compared
    # by the registry against the origin it verified, so it is configured rather than taken from
    # the request's Host header -- a manifest that echoed the caller would say whatever the caller
    # wanted. Defaults to the frontend origin, which is that address on a normal deployment.
    site-origin: ${APP_SCHOOL_SITE_ORIGIN:${app.security.frontend-origin:}}
  mobile-auth:
    # The Universal Links the iOS app may name as its return channel. Only a value on this list is
    # honoured as a redirect target, so a tampered start link cannot divert the one-time code. The
    # default is the one official callback on the guiding page's domain.
    callback-urls: ${APP_MOBILE_AUTH_CALLBACK_URLS:https://clubs.bangxiao.net/mobile-auth/callback}
    # One-time code lifetime, clamped to the contract's 60-120 second window.
    code-ttl-seconds: ${APP_MOBILE_AUTH_CODE_TTL_SECONDS:90}

spring:
  config:
    import: optional:file:.env[.properties]
  task:
    scheduling:
      # Spring Boot's default is a single thread for every @Scheduled method. The Instagram
      # avatar prewarm can hold one for a long time (up to max-refresh-per-run handles, each
      # able to burn the Instaloader subprocess timeout and then the HTTP fallback timeout),
      # which would leave the nightly orphan-upload cleanup waiting behind it.
      pool:
        size: ${SPRING_TASK_SCHEDULING_POOL_SIZE:2}
  servlet:
    multipart:
      # Must sit above ImageStorageService's application-level 5MB image limit -- if they were
      # equal, Tomcat would reject an oversized upload before that readable 400 is ever reached,
      # turning it into dead code. max-request-size leaves headroom for the multipart form's
      # other fields alongside the file itself. The 1MB Spring Boot default is what let uploads
      # between 1MB and the application limit fail with a 500 instead of that 400.
      max-file-size: 6MB
      max-request-size: 8MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/mydb?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    # DB_PASSWORD is required. Provide it via backend/.env (see backend/.env.example).
    # Fail fast at startup if it is missing instead of silently using a committed default.
    password: ${DB_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}
  sql:
    init:
      # Was "always" by default: schema.sql/data.sql are an H2 local-dev fixture (see
      # schema.sql's own file header) that has never successfully run against the real
      # production MySQL schema, and running it there would mean its old unconditional
      # DROP TABLE statements executing on every restart. "never" matches what production
      # already runs with in practice (backend/.env pins SPRING_SQL_INIT_MODE=never) and what
      # actually works; the h2 profile overrides this back to "always" for local dev (see
      # application-h2.yaml).
      mode: ${SPRING_SQL_INIT_MODE:never}
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: "${VITE_API_BASE_URL}/api/auth/google/callback"
            scope:
              - email
              - profile
              - openid

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.demo
  configuration:
    map-underscore-to-camel-case: true
    # Statement logging is a local-dev aid and stays off by default: StdOutImpl prints every
    # statement together with its bound parameters, which for the auth-layer queries means
    # user emails, display names, and avatar URLs land in the process log. The h2 profile
    # turns it back on (see application-h2.yaml), and MYBATIS_LOG_IMPL can enable it
    # temporarily anywhere else.
    log-impl: ${MYBATIS_LOG_IMPL:org.apache.ibatis.logging.nologging.NoLoggingImpl}

# The H2 console is deliberately NOT configured here. It used to be enabled in this base file
# despite its "dev only" comment, and since the H2 driver is a runtime dependency and
# SecurityConfig ends in anyRequest().permitAll(), that left /h2-console reachable by anyone
# on a production deployment, with a login form that accepts an arbitrary JDBC URL. It is now
# only enabled by the h2 profile (application-h2.yaml), which is local development.
