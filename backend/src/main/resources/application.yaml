server:
  address: 127.0.0.1
  port: 8080
  # At the 2MB default, Tomcat aborts the connection on an oversize upload rather than
  # delivering the error body, so the client sees a network error instead of the readable 400
  # ImageStorageService produces. This must exceed multipart.max-request-size below.
  tomcat:
    max-swallow-size: 10MB
  servlet:
    session:
      timeout: 7d
      cookie:
        max-age: 7d  # Persist JSESSIONID across browser restarts
        # MUST stay "lax", never "strict". The Google OAuth2 callback
        # (/api/auth/*/callback) is a cross-site top-level navigation coming back from
        # accounts.google.com; a "strict" cookie is withheld on that first request, so
        # Spring Security can't find the in-flight authorization request and login fails
        # with "authorization_request_not_found". "lax" still blocks the cookie on
        # cross-site subrequests (images, fetch, iframes), which is what CSRF actually
        # exploits, so this is not a meaningful weakening.
        same-site: ${SESSION_COOKIE_SAME_SITE:lax}

app:
  club-location-repair:
    enabled: ${APP_CLUB_LOCATION_REPAIR_ENABLED:true}
  security:
    frontend-origin: ${FRONTEND_ORIGIN}
    allowed-origins:
      - ${app.security.frontend-origin}
    post-login-redirect-uri: "${app.security.frontend-origin}/auth/callback"
    owner-emails: ${APP_OWNER_EMAILS}
    authorization-request-base-uri: ${APP_AUTHORIZATION_REQUEST_BASE_URI:/api/auth/authorize}
    csrf:
      # Server-side CSRF token enforcement, independent of and in addition to the
      # SameSite cookie above. Defaults to false: the frontend does not yet read the
      # XSRF-TOKEN cookie and send it back as X-XSRF-TOKEN on writes, so turning this on
      # before that frontend change ships would 403 every write request. Flip to true
      # once the frontend is updated.
      enabled: ${APP_CSRF_ENABLED:false}
  upload:
    dir: ${APP_UPLOAD_DIR:uploads}
  avatar:
    instagram:
      enabled: ${APP_INSTAGRAM_AVATAR_CACHE_ENABLED:true}
      python-command: ${APP_INSTAGRAM_AVATAR_PYTHON_COMMAND:python3}
      session-user: ${APP_INSTAGRAM_AVATAR_SESSION_USER:}
      session-file: ${APP_INSTAGRAM_AVATAR_SESSION_FILE:}
      cookie-browser: ${APP_INSTAGRAM_AVATAR_COOKIE_BROWSER:}
      cookie-file: ${APP_INSTAGRAM_AVATAR_COOKIE_FILE:}
      profile-api-url-template: ${APP_INSTAGRAM_AVATAR_PROFILE_API_URL_TEMPLATE:https://www.instagram.com/api/v1/users/web_profile_info/?username=%s}
      fetch-timeout-ms: ${APP_INSTAGRAM_AVATAR_FETCH_TIMEOUT_MS:10000}
      # Refresh a cached club avatar after 60 days (approximately two months).
      cache-ttl-ms: ${APP_INSTAGRAM_AVATAR_CACHE_TTL_MS:5184000000}
      # The official MVHS list currently has fewer than 120 Instagram profiles,
      # so a fresh deployment can populate every local icon in its first pass.
      max-refresh-per-run: ${APP_INSTAGRAM_AVATAR_MAX_REFRESH_PER_RUN:120}
      refresh-initial-delay-ms: ${APP_INSTAGRAM_AVATAR_REFRESH_INITIAL_DELAY_MS:30000}
      refresh-fixed-delay-ms: ${APP_INSTAGRAM_AVATAR_REFRESH_FIXED_DELAY_MS:43200000}
      # How long a failed fetch for a given handle is remembered before it is retried again,
      # so a persistently-broken handle can't be hammered on every request for it.
      negative-cache-ttl-ms: ${APP_INSTAGRAM_AVATAR_NEGATIVE_CACHE_TTL_MS:900000}
      # Caps how many distinct handles the public on-demand endpoint (GET
      # /api/avatars/instagram/{handle}) will fetch concurrently; anything beyond this gets
      # the placeholder immediately instead of spawning another Instaloader process.
      max-concurrent-on-demand-refreshes: ${APP_INSTAGRAM_AVATAR_MAX_CONCURRENT_ON_DEMAND_REFRESHES:4}
      # How long the set of club-linked Instagram handles is cached in memory before the
      # public on-demand endpoint (GET /api/avatars/instagram/{handle}) re-queries it. That
      # lookup runs on EVERY request that misses the on-disk avatar cache -- including every
      # request for a random/unknown handle, which by definition always misses -- so without
      # this cache it was an unbounded, unauthenticated full-table club query. The handle set
      # only changes when an admin adds a club or edits its Instagram URL, so 5 minutes trades
      # a short staleness window (a newly-linked handle becomes fetchable within this long,
      # without waiting for the 12-hour prewarm or a restart) for collapsing any burst of
      # requests down to at most one query per window.
      known-handles-cache-ttl-ms: ${APP_INSTAGRAM_AVATAR_KNOWN_HANDLES_CACHE_TTL_MS:300000}
  summary:
    school-name: ${APP_SUMMARY_SCHOOL_NAME:HS Clubs}
    short-name: ${APP_SUMMARY_SHORT_NAME:HS Clubs}
    slug: ${APP_SUMMARY_SLUG:hsclubs}

spring:
  config:
    import: optional:file:.env[.properties]
  servlet:
    multipart:
      # Must sit above ImageStorageService's application-level 5MB image limit -- if they were
      # equal, Tomcat would reject an oversized upload before that readable 400 is ever reached,
      # turning it into dead code. max-request-size leaves headroom for the multipart form's
      # other fields alongside the file itself. The 1MB Spring Boot default is what let uploads
      # between 1MB and the application limit fail with a 500 instead of that 400.
      max-file-size: 6MB
      max-request-size: 8MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/mydb?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    # DB_PASSWORD is required. Provide it via backend/.env (see backend/.env.example).
    # Fail fast at startup if it is missing instead of silently using a committed default.
    password: ${DB_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}
  sql:
    init:
      # Was "always" by default: schema.sql/data.sql are an H2 local-dev fixture (see
      # schema.sql's own file header) that has never successfully run against the real
      # production MySQL schema, and running it there would mean its old unconditional
      # DROP TABLE statements executing on every restart. "never" matches what production
      # already runs with in practice (backend/.env pins SPRING_SQL_INIT_MODE=never) and what
      # actually works; the h2 profile overrides this back to "always" for local dev (see
      # application-h2.yaml).
      mode: ${SPRING_SQL_INIT_MODE:never}
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: "${VITE_API_BASE_URL}/api/auth/google/callback"
            scope:
              - email
              - profile
              - openid

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.demo
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# H2 Console (dev only)
spring.h2.console.enabled: true
spring.h2.console.path: /h2-console
