# H2 in-memory database profile for local dev (no MySQL needed)
spring:
  datasource:
    url: jdbc:h2:mem:mydb;MODE=MYSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      continue-on-error: true
  h2:
    console:
      enabled: true
      path: /h2-console
