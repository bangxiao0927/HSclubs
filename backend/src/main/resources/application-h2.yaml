# H2 in-memory database profile for local dev (no MySQL needed)
spring:
  datasource:
    url: jdbc:h2:mem:mydb;MODE=MYSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      continue-on-error: true
      # Reset first (h2-only destructive DROP TABLE script, never the production schema
      # location), then build the schema fixture, so every local h2-profile startup gets a
      # clean slate. schema.sql itself no longer drops anything, since it is also the
      # (inert, mode: never) file the production datasource resolves by default.
      schema-locations:
        - classpath:db/h2/reset.sql
        - classpath:schema.sql
      # data.sql lives under db/h2 specifically so it is never on the production datasource's
      # default init path -- only this profile references it.
      data-locations: classpath:db/h2/data.sql
  h2:
    console:
      enabled: true
      path: /h2-console

# Local development wants to see the SQL MyBatis actually runs; the base config keeps this off
# because the printed bound parameters include user PII (see application.yaml).
mybatis:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
