app:
  security:
    owner-emails:
      - test-owner@example.com

spring:
  datasource:
    url: jdbc:h2:mem:hsclubs_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: never
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-client-id
            client-secret: test-client-secret
            redirect-uri: "${VITE_API_BASE_URL}/api/auth/google/callback"
            scope:
              - email
              - profile
              - openid
